apiVersion: v1
kind: Secret
metadata:
  name: test-mysql-root
  namespace: default
stringData:
  password: rootpass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-mysql
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: test-mysql}
  template:
    metadata:
      labels: {app: test-mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpass
            - name: MYSQL_ROOT_HOST
              value: "%"
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-prootpass"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: test-mysql
  namespace: default
spec:
  selector: {app: test-mysql}
  ports:
    - port: 3306
